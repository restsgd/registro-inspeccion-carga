<style>
:root{--navy:#12181f;--navy2:#182430;--navy3:#24313c;--steel:#657582;--line:#3a4854;--text:#e7edf2;--muted:#9eabb5;--amber:#e2933a;--red:#c1443d;--green:#2e7d5b}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#10161c;color:var(--text);min-height:100vh}
header.appbar{background:#182430;color:#E5E7EB;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-logo-wrap{background:#12181f;border-radius:8px;padding:4px;flex:none;display:flex;align-items:center}.brand-logo{height:44px;width:auto;display:block}.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}.brand-text b{font-family:"Bahnschrift","Segoe UI Semibold",sans-serif;font-size:15.5px;letter-spacing:1.1px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;line-height:1.15}.brand-text span{font-size:9.5px;color:#c7d2da;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}.appbar-actions{display:flex;gap:8px}.icon-btn{background:#1f2f3d;color:#E5E7EB;border:1px solid #2a4054;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600}
.vnav{background:#59636d;border-top:1px solid #77818b;border-bottom:1px solid #3d464e;display:flex;gap:3px;align-items:center;padding:5px 12px;position:sticky;top:64px;z-index:30;box-shadow:0 3px 12px rgba(0,0,0,.24);overflow:auto}.vnav button{background:transparent;border:0;color:#f2f5f7;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;cursor:pointer;white-space:nowrap}.vnav button:hover,.vnav button.active{background:#3f4952}
main{max-width:1180px;margin:0 auto;padding:18px 16px 100px}.home{background:#18232d;border:1px solid #34424e;border-radius:14px;padding:20px;box-shadow:0 14px 35px rgba(0,0,0,.25)}.floating{width:min(780px,100%);margin:0 auto;background:#202b35;border:1px solid #43515d;border-radius:14px;padding:20px;box-shadow:0 18px 42px rgba(0,0,0,.32)}.floating h1{margin:0 0 7px;font-family:"Bahnschrift","Segoe UI Semibold",sans-serif;font-size:24px;letter-spacing:1px;text-transform:uppercase;color:#fff}.floating p{margin:0;color:#b9c4cd;font-size:12.5px;line-height:1.6}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{background:#151c22;border:1px solid #3b4853;color:#d7e0e6;border-radius:999px;padding:6px 10px;font-size:10px}.primary{margin-top:16px;width:100%;background:var(--amber);color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;letter-spacing:.35px;cursor:pointer}
.section{background:#1a252e;border:1px solid #34424e;border-radius:12px;overflow:hidden;margin-top:16px}.section-head{padding:12px 15px;border-bottom:1px solid #34424e;display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head h2{margin:0;color:#f1f4f6;font-size:12px;letter-spacing:.6px;text-transform:uppercase}.section-body{padding:12px 15px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#151e26;border:1px solid #35434f;border-radius:9px;padding:11px}.kpi .n{font-family:Consolas,monospace;font-size:20px;font-weight:800;color:#fff}.kpi .l{font-size:9px;color:#8f9da8;text-transform:uppercase;letter-spacing:.45px;margin-top:3px}
.tblwrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th{background:#12181f;color:#dbe4ea;padding:9px 8px;text-align:left;font-size:9px;letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}.tbl td{padding:8px;border-bottom:1px solid #303c46;color:#cbd5dc;white-space:nowrap}.tbl tr:nth-child(even) td{background:#1d2831}.empty{text-align:center;color:#8997a2;padding:18px;font-size:12px}
.form{background:#1b2731;border:1px solid #3b4955;border-radius:14px;width:70%;margin:0 auto;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.34)}.formhead{background:#202d38;padding:14px 17px;border-bottom:1px solid #40505c;display:flex;justify-content:space-between;align-items:center;gap:10px}.formhead h2{margin:0;color:#fff;font-family:"Bahnschrift","Segoe UI Semibold",sans-serif;font-size:15px;letter-spacing:.45px;text-transform:uppercase}.block{padding:14px 17px;border-bottom:1px solid #35434e}.blocktitle{font-size:11px;font-weight:800;letter-spacing:.55px;color:#e6edf1;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 12px}.field{display:flex;align-items:center;gap:7px;min-width:0}.field label{font-size:9px;font-weight:800;color:#9facb5;white-space:nowrap;text-transform:none;letter-spacing:.2px}.field input,.field select,.field textarea{flex:1;min-width:0;padding:7px 8px;background:#121a21;color:#eef3f6;border:1px solid #465662;border-radius:6px;font-size:11px}.field textarea{min-height:32px;resize:vertical}.wide{grid-column:1/-1}.tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:11px}.tools .field{flex:1 1 170px}.btnadd,.btnclear,.btnsave,.btndraft,.btncancel{border-radius:7px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}.btnadd,.btnsave{background:var(--amber);color:#fff;border:1px solid var(--amber)}.btnclear,.btndraft,.btncancel{background:#313d47;color:#e2e8ec;border:1px solid #4b5964}.averwrap{overflow:auto;border:1px solid #35434e;border-radius:8px}.aver{min-width:1250px}.status{font-size:9px;padding:4px 7px;border-radius:999px;background:#34424d;color:#dce5ea}.status.ok{background:#205b43}.status.draft{background:#70501d}.actions{display:flex;gap:8px;justify-content:flex-end;padding:13px 17px;background:#151e26;border-top:1px solid #35434e;position:sticky;bottom:0}.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.preview{display:flex;gap:7px;flex-wrap:wrap}.preview span{position:relative}.preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #465662}.preview button{position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#c1443d;color:#fff;width:18px;height:18px;cursor:pointer}
@media(max-width:900px){.form{width:100%}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.brand-text{display:none}.brand-logo{height:36px}.vnav{top:55px}}

/* ===== Adaptación móvil / responsive v10 ===== */
@media (max-width:900px){
  main{padding:12px 10px 90px}
  .home{padding:12px}
  .floating{width:100%;padding:16px}
  .form{width:100%;border-radius:12px}
  .formhead{padding:12px 13px}
  .block{padding:12px 13px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 10px}
  .field{align-items:center}

<script>
const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const RECUENTO_INICIAL=[{mes:'ENERO',furlog:6,autoport:6,sedan:30,cross:72},{mes:'FEBRERO',furlog:18,autoport:12,sedan:28,cross:224},{mes:'MARZO',furlog:20,autoport:16,sedan:28,cross:264},{mes:'ABRIL',furlog:9,autoport:12,sedan:0,cross:168},{mes:'MAYO',furlog:19,autoport:6,sedan:0,cross:200},{mes:'JUNIO',furlog:5,autoport:13,sedan:10,cross:138},{mes:'JULIO',furlog:0,autoport:0,sedan:0,cross:0},{mes:'AGOSTO',furlog:0,autoport:0,sedan:0,cross:0},{mes:'SEPTIEMBRE',furlog:0,autoport:0,sedan:0,cross:0},{mes:'OCTUBRE',furlog:0,autoport:0,sedan:0,cross:0},{mes:'NOVIEMBRE',furlog:0,autoport:0,sedan:0,cross:0},{mes:'DICIEMBRE',furlog:0,autoport:0,sedan:0,cross:0}];
let DATA={inspecciones:[],averias:[],recuento:RECUENTO_INICIAL};
let loading=true;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function insp(){return DATA.inspecciones||[]}
function aver(){return DATA.averias||[]}
function rec(){return DATA.recuento||RECUENTO_INICIAL}
function totals(){let r=rec(),tf=0,ta=0,ts=0,tc=0;r.forEach(x=>{tf+=+x.furlog||0;ta+=+x.autoport||0;ts+=+x.sedan||0;tc+=+x.cross||0});return{viajes:tf+ta,unidades:ts+tc,tf,ta,ts,tc}}
function active(id){document.querySelectorAll('.vnav button').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active')}
function runServer(fn,arg){return new Promise((resolve,reject)=>{let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);arg===undefined?r[fn]():r[fn](arg)})}
async function loadData(){
  loading=true;
  try{DATA=await runServer('getAppData');}catch(e){alert('No fue posible cargar los datos: '+(e?.message||e));}
  loading=false;
}
function hallazgosHTML(a){if(!a.length)return '<div class="empty">No hay hallazgos registrados.</div>';let rows=a.slice().sort((x,y)=>new Date(y.fechaRegistro||y.fecha)-new Date(x.fechaRegistro||x.fecha)).slice(0,10).map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.transporte)}</td><td>${esc(x.idEquipo)}</td><td>${esc(x.vin)}</td><td>${esc(x.danos)}</td><td>${esc(x.origen)}</td><td>${esc(x.cargo)}</td></tr>`).join('');return `<div class="tblwrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Transporte</th><th>ID</th><th>VIN</th><th>Daños</th><th>Origen</th><th>Cargo</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function home(){const i=insp(),a=aver(),t=totals(),draft=i.filter(x=>x.estado==='BORRADOR').length;document.getElementById('app').innerHTML=`<div class="home"><div class="floating"><h1>REGISTRO SERVICIOS INSPECCION DE CARGA</h1><p>Respaldo digital de trazabilidad operacional, recuento de prestaciones y registro de incidencias.</p><div class="meta"><span class="pill">Base: INSPECCIÓN DE RIESGOS - CALIDAD - RECUENTO TCL 2026</span></div><button class="primary" onclick="formFicha()">FICHA REGISTRO INSPECCION</button></div><section class="section"><div class="section-head"><h2>Estado operacional</h2></div><div class="section-body"><div class="kpis"><div class="kpi"><div class="n">${t.viajes}</div><div class="l">Viajes registrados</div></div><div class="kpi"><div class="n">${t.unidades}</div><div class="l">Unidades registradas</div></div><div class="kpi"><div class="n">${a.length}</div><div class="l">Hallazgos</div></div><div class="kpi"><div class="n">${draft}</div><div class="l">Borradores</div></div></div></div></section><section class="section"><div class="section-head"><h2>TABLA RESUMEN HALLAZGOS</h2><button class="btnclear" onclick="hallazgos()">Ver detalle</button></div><div class="section-body">${hallazgosHTML(a)}</div></section></div>`;active('nHome')}
function formFicha(editId=null){
  const d=editId?insp().find(x=>x.id===editId):null;
  let rows=(d?.averias||[]).map(x=>({...x}));
  let photos=(d?.fotos||[]).map(x=>x);
  let editing=null;
  document.getElementById('app').innerHTML=`<section class="form"><div class="formhead"><h2>FICHA REGISTRO INSPECCION</h2><span class="status ${d?.estado==='BORRADOR'?'draft':'ok'}">${d?.estado||'NUEVA'}</span></div><div class="block"><div class="blocktitle">1.-ID TRANSPORTE+CARGA</div><div class="grid"><div class="field"><label>Mes</label><select id="fMes">${MESES.map(m=>`<option ${d?.mes===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Día</label><input id="fDia" type="number" min="1" max="31" value="${d?.dia||new Date().getDate()}"></div><div class="field"><label>ID Equipo</label><input id="fId" value="${esc(d?.idEquipo)}"></div><div class="field"><label>Empresa Transporte</label><select id="fEmp"><option ${d?.empresa==='FURLONG'?'selected':''}>FURLONG</option><option ${d?.empresa==='AUTOPORT'?'selected':''}>AUTOPORT</option></select></div><div class="field"><label>N° Unidades Sedan</label><input id="fSedan" type="number" min="0" value="${d?.sedan??0}"></div><div class="field"><label>N° Unidades Cross</label><input id="fCross" type="number" min="0" value="${d?.cross??0}"></div><div class="field"><label>Fecha Inspección</label><input id="fFecha" type="date" value="${d?.fecha||today()}"></div><div class="field wide"><label>Observación / Turno</label><input id="fObs" value="${esc(d?.observacion)}"></div></div></div><div class="block"><div class="blocktitle">2.-AVERIAS DETECTADAS</div><div class="tools"><div class="field"><label>Transporte</label><select id="aTrans"><option>FURLONG</option><option>AUTOPORT</option></select></div><div class="field"><label>ID Equipo</label><input id="aId"></div><div class="field"><label>Fecha</label><input id="aFecha" type="date" value="${today()}"></div><div class="field"><label>VIN</label><input id="aVin"></div><div class="field"><label>Modelo</label><select id="aModelo"><option>C. CROSS</option><option>COROLLA SEDAN</option><option>COROLLA CROSS</option><option>OTRO</option></select></div><div class="field"><label>Ubicación</label><select id="aUbi"><option>FRONTAL</option><option>TRASERO</option><option>LATERAL IZQ</option><option>LATERAL DER</option><option>TECHO</option></select></div><div class="field"><label>N°</label><input id="aNum"></div><div class="field"><label>Área</label><input id="aArea"></div><div class="field"><label>Subárea</label><input id="aSub"></div><div class="field"><label>Daños</label><select id="aDan"><option>PELADO</option><option>RAYA SUPERFICIAL DELGADA</option><option>ABOLLADURA DAÑO PINTURA</option><option>ABOLLADURA S/DAÑO PINTURA</option><option>VARIOS DAÑOS</option></select></div><div class="field"><label>Grado</label><select id="aGrado"><option>1</option><option>2</option><option>3</option></select></div><div class="field"><label>Cuadrante</label><input id="aCua"></div><div class="field"><label>Medida</label><select id="aMed"><option value=">2CM">&gt;2CM</option><option value="&lt;2CM">&lt;2CM</option><option>OTRO</option></select></div><div class="field"><label>Origen</label><select id="aOri"><option>TRANSPORTE</option><option>FABRICA</option><option>RECINTO</option></select></div><div class="field"><label>Cargo Daño</label><select id="aCargo"><option>SEGURO</option><option>GARANTIA</option></select></div><div class="field wide"><label>Observaciones</label><textarea id="aObs"></textarea></div><button class="btnadd" id="add">＋ Agregar fila</button><button class="btnclear" id="clear">Limpiar campos</button></div><div class="averwrap"><table class="tbl aver"><thead><tr><th>Transp.</th><th>ID</th><th>Fecha</th><th>VIN</th><th>Modelo</th><th>Ubicación</th><th>N°</th><th>Área</th><th>Subárea</th><th>Daños</th><th>Grado</th><th>Cuadrante</th><th>Medida</th><th>Origen</th><th>Cargo</th><th>Observaciones</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="block"><div class="blocktitle">RESPALDO DE LA INSPECCIÓN</div><div class="grid"><div class="field wide"><label>Fotos</label><div class="photo"><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="preview" class="preview"></div></div></div></div></div><div class="actions"><button class="btndraft" id="draft">Guardar borrador</button><button class="btncancel" id="cancel">Cancelar</button><button class="btnsave" id="save">${editId?'Actualizar':'Grabar inspección'}</button></div></section>`;
  const ids=['aTrans','aId','aFecha','aVin','aModelo','aUbi','aNum','aArea','aSub','aDan','aGrado','aCua','aMed','aOri','aCargo','aObs'];
  const keys=['transporte','idEquipo','fecha','vin','modelo','ubicacion','numero','area','subarea','danos','grado','cuadrante','medida','origen','cargo','observaciones'];
  function clear(){document.getElementById('aTrans').value=document.getElementById('fEmp').value;document.getElementById('aId').value=document.getElementById('fId').value;document.getElementById('aFecha').value=document.getElementById('fFecha').value||today();['aVin','aNum','aArea','aSub','aCua','aObs'].forEach(x=>document.getElementById(x).value='');['aModelo','aUbi','aDan','aGrado','aMed','aOri','aCargo'].forEach(x=>document.getElementById(x).selectedIndex=0);editing=null;document.getElementById('add').textContent='＋ Agregar fila'}
  function draw(){document.getElementById('rows').innerHTML=rows.length?rows.map((r,i)=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}<td><button class="btnclear" onclick="editRow(${i})">Editar</button> <button class="btnclear" onclick="delRow(${i})">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="17" class="empty">Sin averías agregadas a esta ficha.</td></tr>'}
  window.editRow=i=>{const r=rows[i];ids.forEach((id,j)=>document.getElementById(id).value=r[keys[j]]||'');editing=i;document.getElementById('add').textContent='Actualizar fila'};
  window.delRow=i=>{rows.splice(i,1);clear();draw()};
  document.getElementById('add').onclick=()=>{let r={};ids.forEach((id,j)=>r[keys[j]]=document.getElementById(id).value.trim());if(!r.idEquipo){alert('ID Equipo obligatorio en la avería');return}r.id=editing!==null?rows[editing].id:uid();r.fechaRegistro=new Date().toISOString();if(editing!==null)rows[editing]=r;else rows.push(r);clear();draw()};
  document.getElementById('clear').onclick=clear;
  document.getElementById('fEmp').onchange=()=>{if(editing===null)document.getElementById('aTrans').value=document.getElementById('fEmp').value};
  document.getElementById('fId').oninput=()=>{if(editing===null)document.getElementById('aId').value=document.getElementById('fId').value};
  document.getElementById('fFecha').onchange=()=>{if(editing===null)document.getElementById('aFecha').value=document.getElementById('fFecha').value};
  const pi=document.getElementById('photos');
  function drawPhotos(){document.getElementById('preview').innerHTML=photos.map((x,i)=>`<span><img src="${esc(x)}"><button type="button" onclick="delPhoto(${i})">×</button></span>`).join('')}
  window.delPhoto=i=>{photos.splice(i,1);drawPhotos()};
  pi.onchange=async e=>{
    for(const f of e.target.files){
      try{
        const data=await imageData(f);
        const kb=Math.round(data.length*0.75/1024);
        if(kb>700){alert('La foto supera 700 KB después de comprimirla. Selecciona otra imagen o toma una foto con menor resolución.');continue}
        photos.push(data);
      }catch(err){alert('No se pudo procesar la foto: '+(err?.message||err));}
    }
    drawPhotos();pi.value='';
  };
  function imageData(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=800,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.55))};im.src=u})}
  drawPhotos();
  async function persist(state){
    const r={id:editId||uid(),mes:fMes.value,dia:+fDia.value||1,idEquipo:fId.value.trim(),empresa:fEmp.value,sedan:+fSedan.value||0,cross:+fCross.value||0,fecha:fFecha.value,observacion:fObs.value.trim(),averias:rows.map(x=>({...x})),fotos:photos.slice(),firma:'',estado:state,fechaRegistro:d?.fechaRegistro||new Date().toISOString(),fechaActualizacion:new Date().toISOString()};
    if(!r.idEquipo){alert('ID Equipo obligatorio');return}
    const btn=document.getElementById(state==='BORRADOR'?'draft':'save');
    const payloadBytes=new Blob([JSON.stringify(r)]).size;
    if(payloadBytes>4500000){alert('La información de la inspección es demasiado grande para enviarla de una vez. Reduce las fotografías e inténtalo nuevamente.');return}
    btn.disabled=true;btn.textContent='Guardando...';
    try{
      const result=await runServer('saveInspection',r);
      if(!result||result.ok!==true){throw new Error('El servidor no confirmó el guardado.');}
      try{await loadData();}catch(refreshError){console.warn('Guardado confirmado; no fue posible refrescar los datos:',refreshError);}
      btn.textContent='Guardado ✓';
      setTimeout(()=>{ alert((state==='BORRADOR'?'Borrador guardado correctamente':'Inspección grabada correctamente')+'\nID: '+(result.id||r.id)); home(); },120);
    }catch(e){
      btn.disabled=false;
      btn.textContent=state==='BORRADOR'?'Guardar borrador':'Grabar inspección';
      alert('No fue posible guardar: '+(e?.message||e));
    }
  }
  document.getElementById('draft').onclick=()=>persist('BORRADOR');document.getElementById('save').onclick=()=>persist('GRABADO');document.getElementById('cancel').onclick=home;draw();clear();
  if(d?.averias) { rows=d.averias.map(x=>({...x})); draw(); }
}
function hallazgos(){const a=aver();document.getElementById('app').innerHTML=`<section class="section"><div class="section-head"><h2>TABLA RESUMEN HALLAZGOS</h2><button class="btnclear" onclick="home()">Volver</button></div><div class="section-body"><div class="tblwrap"><table class="tbl"><thead><tr><th>Transp.</th><th>ID</th><th>Fecha</th><th>VIN</th><th>Modelo</th><th>Ubicación</th><th>Área</th><th>Daños</th><th>Grado</th><th>Origen</th><th>Cargo</th><th>Obs.</th><th></th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td>${esc(x.transporte)}</td><td>${esc(x.idEquipo)}</td><td>${esc(x.fecha)}</td><td>${esc(x.vin)}</td><td>${esc(x.modelo)}</td><td>${esc(x.ubicacion)}</td><td>${esc(x.area)}</td><td>${esc(x.danos)}</td><td>${esc(x.grado)}</td><td>${esc(x.origen)}</td><td>${esc(x.cargo)}</td><td>${esc(x.observaciones)}</td><td><button class="btnclear" onclick="formFicha('${esc(x.parentInspectionId||'')}')">Editar ficha</button></td></tr>`).join(''):'<tr><td colspan="13" class="empty">No hay hallazgos registrados.</td></tr>'}</tbody></table></div></div></section>`;active('nHall')}
function recuento(){const r=rec(),t=totals();document.getElementById('app').innerHTML=`<section class="section"><div class="section-head"><h2>RECUENTO MENSUAL</h2><button class="btnclear" onclick="home()">Volver</button></div><div class="section-body"><div class="tblwrap"><table class="tbl"><thead><tr><th>Mes</th><th>Furlong</th><th>Autoport</th><th>Sedan</th><th>Cross</th><th>Viajes</th><th>Unidades</th></tr></thead><tbody>${r.map(x=>{let v=(+x.furlog||0)+(+x.autoport||0),u=(+x.sedan||0)+(+x.cross||0);return `<tr><td>${x.mes}</td><td>${x.furlog}</td><td>${x.autoport}</td><td>${x.sedan}</td><td>${x.cross}</td><td>${v}</td><td>${u}</td></tr>`}).join('')}<tr><td><b>Totales</b></td><td>${t.tf}</td><td>${t.ta}</td><td>${t.ts}</td><td>${t.tc}</td><td><b>${t.viajes}</b></td><td><b>${t.unidades}</b></td></tr></tbody></table></div></div></section>`;active('nRec')}
function exportAll(){const data={inspecciones:insp(),averias:aver(),recuento:rec(),fecha:new Date().toISOString(),version:'V10'};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='respaldo_inspecciones_carga_V10.json';a.click();URL.revokeObjectURL(u)}
function importAll(file){const rd=new FileReader();rd.onload=async x=>{try{const d=JSON.parse(x.target.result);if(d.inspecciones)for(const r of d.inspecciones)await runServer('saveInspection',r);await loadData();home();}catch(err){alert('Archivo no válido o no pudo importarse: '+err.message)}};rd.readAsText(file)}
document.getElementById('btnHome').onclick=home;document.getElementById('btnExport').onclick=exportAll;document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();document.getElementById('fileImport').onchange=e=>{const f=e.target.files[0];if(f)importAll(f);e.target.value=''};
document.getElementById('nHome').onclick=home;document.getElementById('nFicha').onclick=()=>formFicha();document.getElementById('nHall').onclick=hallazgos;document.getElementById('nRec').onclick=recuento;document.getElementById('nExp').onclick=exportAll;
home();(async()=>{try{await loadData();home();}catch(e){console.error(e);}})();
</script></body></html>
