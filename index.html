<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Servicios Inspección de Carga</title>
<meta name="theme-color" content="#0f4c81">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RIC Carga">
<style>
  html, body { margin:0; padding:0; min-height:100%; background:#0f4c81; font-family: system-ui, -apple-system, sans-serif; }
  #splash {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0f4c81; color:#ffffff; gap:14px; padding:24px; box-sizing:border-box; text-align:center;
  }
  #splash img { width:96px; height:96px; border-radius:20px; }
  #splash h1 { font-size:18px; margin:4px 0 0; font-weight:600; }
  #splash p { font-size:14px; opacity:.85; margin:0; max-width:320px; }
  .btn {
    margin-top:10px; border:none; padding:14px 24px; border-radius:28px;
    font-size:15px; font-weight:600; cursor:pointer; width:100%; max-width:320px;
  }
  #install-btn { background:#ffffff; color:#0f4c81; display:none; box-shadow:0 4px 12px rgba(0,0,0,.25); }
  #open-btn { background:transparent; color:#ffffff; border:2px solid rgba(255,255,255,.5) !important; }
  #ios-help { display:none; font-size:13px; opacity:.9; max-width:300px; margin-top:6px; background:rgba(255,255,255,.12); padding:12px; border-radius:12px; }
</style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="Logo">
    <h1>Registro Servicios Inspección de Carga</h1>
    <p>Instala el ícono en este equipo para acceso rápido, o abre el formulario directamente.</p>

    <button id="install-btn" class="btn">📲 Instalar app en este equipo</button>
    <div id="ios-help">En iPhone/iPad: toca el botón compartir (□↑) de Safari y elige "Agregar a pantalla de inicio".</div>

    <button id="open-btn" class="btn">Abrir formulario de inspección</button>
  </div>

  <script>
    const DESTINO = "https://script.google.com/macros/s/AKfycbwEpQ_7C0yKgnaJ__X5Xh76PkrAxC2-ecb7u-vFdrcPAHrzeyA-QrtoVabehMKDmkZ_/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const openBtn = document.getElementById('open-btn');
    const iosHelp = document.getElementById('ios-help');

    // Detecta iOS (Safari no dispara beforeinstallprompt, hay que guiar manualmente)
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
    if (isIos) {
      iosHelp.style.display = 'block';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });

    // Solo navega a la app real cuando el usuario lo pide explícitamente.
    // NO hay redirección automática: así el botón de instalar alcanza a
    // aparecer y no desaparece antes de poder tocarlo.
    openBtn.addEventListener('click', () => {
      window.location.href = DESTINO;
    });
  </script>
</body>
</html>
