<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Servicios Inspección de Carga</title>
<meta name="theme-color" content="#0f4c81">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RIC Carga">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f4c81; font-family: system-ui, -apple-system, sans-serif; }
  #splash {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0f4c81; color:#ffffff; gap:16px;
  }
  #splash img { width:88px; height:88px; border-radius:16px; }
  #splash p { font-size:14px; opacity:.85; margin:0; }
  #install-btn {
    margin-top:8px; display:none;
    background:#ffffff; color:#0f4c81; border:none; padding:10px 18px; border-radius:24px;
    font-size:14px; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.25); cursor:pointer;
  }
  #manual-link { margin-top:14px; font-size:13px; }
  #manual-link a { color:#ffffff; }
</style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="Logo">
    <p>Abriendo Registro Servicios Inspección de Carga…</p>
    <button id="install-btn">Instalar app en este equipo</button>
    <div id="manual-link"><a href="https://script.google.com/macros/s/AKfycbwEpQ_7C0yKgnaJ__X5Xh76PkrAxC2-ecb7u-vFdrcPAHrzeyA-QrtoVabehMKDmkZ_/exec">Si no redirige solo, toca aquí</a></div>
  </div>

  <script>
    // NOTA TÉCNICA: Google bloquea la carga de Apps Script dentro de un
    // iframe alojado en un dominio externo (política de seguridad de
    // Google, no de esta página). Por eso este wrapper NO usa iframe:
    // en vez de eso, redirige automáticamente a la app real. El ícono
    // instalado sigue funcionando igual — al tocarlo, pasa por aquí un
    // instante y abre el formulario real.
    const DESTINO = "https://script.google.com/macros/s/AKfycbwEpQ_7C0yKgnaJ__X5Xh76PkrAxC2-ecb7u-vFdrcPAHrzeyA-QrtoVabehMKDmkZ_/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
      window.location.href = DESTINO;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });

    // Redirección automática a los 1.2s si el usuario no interactúa con
    // el botón de instalar (esto le da tiempo al navegador de mostrar el
    // prompt de instalación antes de saltar a la app real).
    setTimeout(() => {
      if (document.visibilityState !== 'hidden') window.location.href = DESTINO;
    }, 1200);
  </script>
</body>
</html>
